name: Build with SLSA Provenance

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          mkdir -p dist
          
          # 如果根目录下没有 go.mod，先初始化一个
          if [ ! -f "go.mod" ]; then
            go mod init c2-rich
          fi

          # 进入 server-go 目录编译
          cd server-go
          if [ ! -f "go.mod" ]; then
            go mod init server-go || true
          fi
          go build -o ../dist/server-go .
          cd ..

          # 进入 client-go 目录编译
          cd client-go
          if [ ! -f "go.mod" ]; then
            go mod init client-go || true
          fi
          go build -o ../dist/client-go .
          cd ..

      - name: Create archive
        run: |
          cd dist
          sha256sum server-go client-go > checksums.txt
          tar -czvf c2-rich-binaries.tar.gz server-go client-go

      - name: Generate hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum c2-rich-binaries.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
