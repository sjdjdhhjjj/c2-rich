name: Build with SLSA Provenance

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build your artifact
        run: |
          # 替换为你的实际构建命令
          echo "hello world" > artifact.txt

      # 1. 必须使用 actions/upload-artifact 将构建产物保存，供后续流程验证
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: artifact.txt
          if-no-files-found: error
          retention-days: 1

      - name: Generate hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifact.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      actions: read      # 读取 workflow 元数据
      id-token: write    # OIDC 密钥签名
      contents: write    # 上传 Release 资产
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
