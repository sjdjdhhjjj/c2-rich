name: Build with SLSA Provenance

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          mkdir -p dist
          go build -o dist/server-go ./server-go
          go build -o dist/client-go ./client-go

      - name: Create archive
        run: |
          cd dist
          sha256sum server-go client-go > checksums.txt
          tar -czvf c2-rich-binaries.tar.gz server-go client-go

      - name: Generate hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum c2-rich-binaries.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
